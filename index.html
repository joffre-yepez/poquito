['Saludos · Begrüßungen','Hola heißt Hallo. Buenos días sagt man morgens, buenas tardes nachmittags und buenas noches abends oder zum Abschied vor dem Schlafen.','Usamos hola para saludar. Buenos días por la mañana, buenas tardes por la tarde y buenas noches por la noche.',[['Hallo','Hola',['Adiós','Gracias'],'Hola ist ein Gruß; adiós ist ein Abschied. / Hola es un saludo.'],['Guten Morgen','Buenos días',['Buenas noches','Buenas tardes'],'Días gehört zum Morgengruß. / Buenos días se usa por la mañana.'],['Gute Nacht','Buenas noches',['Buenos días','Hasta luego'],'Noches bedeutet Nächte. / Buenas noches se usa por la noche.']]],

['Pronombres · Personalpronomen','Yo = ich, tú = du, él = er, ella = sie, nosotros/nosotras = wir. Im Spanischen lässt man das Subjekt oft weg.','Yo, tú, él, ella, nosotros/nosotras. Muchas veces omitimos el pronombre.',[['ich','yo',['tú','él'],'Yo bezeichnet den Sprecher. / Yo indica quien habla.'],['du','tú',['yo','ella'],'Tú spricht eine Person direkt an. / Tú se refiere al interlocutor.'],['wir (gemischte Gruppe)','nosotros',['ella','tú'],'Nosotros ist die erste Person Plural. / Primera persona plural.']]],

, te levantas usw. Das Pronomen gehört zur Person.", "Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado.", [["Ich stehe auf.", "Me levanto.", ["Te levantas.", "Se levanta.", "Nos levantamos."], "Zu „Ich stehe auf.“ passt „Me levanto.“. Bei reflexiven Verben steht me, te, se, nos, os, se vor dem Verb. Levantarse wird me levanto, te levantas usw. Das Pronomen gehört zur Person. / Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado."], ["Du stehst auf.", "Te levantas.", ["Se levanta.", "Nos levantamos.", "Os levantáis."], "Zu „Du stehst auf.“ passt „Te levantas.“. Bei reflexiven Verben steht me, te, se, nos, os, se vor dem Verb. Levantarse wird me levanto, te levantas usw. Das Pronomen gehört zur Person. / Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado."], ["Sie steht auf.", "Se levanta.", ["Nos levantamos.", "Os levantáis.", "Se levantan."], "Zu „Sie steht auf.“ passt „Se levanta.“. Bei reflexiven Verben steht me, te, se, nos, os, se vor dem Verb. Levantarse wird me levanto, te levantas usw. Das Pronomen gehört zur Person. / Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado."], ["Wir stehen auf.", "Nos levantamos.", ["Os levantáis.", "Se levantan.", "Me levanto."], "Zu „Wir stehen auf.“ passt „Nos levantamos.“. Bei reflexiven Verben steht me, te, se, nos, os, se vor dem Verb. Levantarse wird me levanto, te levantas usw. Das Pronomen gehört zur Person. / Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado."], ["Ihr steht auf (Spanien).", "Os levantáis.", ["Se levantan.", "Me levanto.", "Te levantas."], "Zu „Ihr steht auf (Spanien).“ passt „Os levantáis.“. Bei reflexiven Verben steht me, te, se, nos, os, se vor dem Verb. Levantarse wird me levanto, te levantas usw. Das Pronomen gehört zur Person. / Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado."], ["Sie stehen auf.", "Se levantan.", ["Me levanto.", "Te levantas.", "Se levanta."], "Zu „Sie stehen auf.“ passt „Se levantan.“. Bei reflexiven Verben steht me, te, se, nos, os, se vor dem Verb. Levantarse wird me levanto, te levantas usw. Das Pronomen gehört zur Person. / Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado."]]], ["Frecuencia · Häufigkeit", "Siempre, normalmente, a veces und nunca beschreiben, wie oft etwas passiert. Nunca vor dem Verb braucht kein zusätzliches no.", "Siempre, normalmente, a veces y nunca indican frecuencia. Nunca delante del verbo no necesita no.", [["immer", "siempre", ["normalmente", "a veces", "nunca"], "Zu „immer“ passt „siempre“. Siempre, normalmente, a veces und nunca beschreiben, wie oft etwas passiert. Nunca vor dem Verb braucht kein zusätzliches no. / Siempre, normalmente, a veces y nunca indican frecuencia. Nunca delante del verbo no necesita no."], ["normalerweise", "normalmente", ["a veces", "nunca", "todos los días"], "Zu „normalerweise“ passt „normalmente“. Siempre, normalmente, a veces und nunca beschreiben, wie oft etwas passiert. Nunca vor dem Verb braucht kein zusätzliches no. / Siempre, normalmente, a veces y nunca indican frecuencia. Nunca delante del verbo no necesita no."], ["manchmal", "a veces", ["nunca", "todos los días", "siempre"], "Zu „manchmal“ passt „a veces“. Siempre, normalmente, a veces und nunca beschreiben, wie oft etwas passiert. Nunca vor dem Verb braucht kein zusätzliches no. / Siempre, normalmente, a veces y nunca indican frecuencia. Nunca delante del verbo no necesita no."], ["nie", "nunca", ["todos los días", "siempre", "normalmente"], "Zu „nie“ passt „nunca“. Siempre, normalmente, a veces und nunca beschreiben, wie oft etwas passiert. Nunca vor dem Verb braucht kein zusätzliches no. / Siempre, normalmente, a veces y nunca indican frecuencia. Nunca delante del verbo no necesita no."], ["jeden Tag", "todos los días", ["siempre", "normalmente", "a veces"], "Zu „jeden Tag“ passt „todos los días“. Siempre, normalmente, a veces und nunca beschreiben, wie oft etwas passiert. Nunca vor dem Verb braucht kein zusätzliches no. / Siempre, normalmente, a veces y nunca indican frecuencia. Nunca delante del verbo no necesita no."]]], ["En el restaurante · Restaurant", "Quisiera ist eine höfliche feste Wendung für ich hätte gern. Para mí ... bestellt für sich. La cuenta, por favor bittet um die Rechnung.", "Quisiera es una fórmula de cortesía. Para mí sirve para pedir algo. La cuenta, por favor pide la cuenta.", [["Ich hätte gern Wasser.", "Quisiera agua.", ["Para mí, un café.", "La cuenta, por favor.", "¿Tiene pan?"], "Zu „Ich hätte gern Wasser.“ passt „Quisiera agua.“. Quisiera ist eine höfliche feste Wendung für ich hätte gern. Para mí ... bestellt für sich. La cuenta, por favor bittet um die Rechnung. / Quisiera es una fórmula de cortesía. Para mí sirve para pedir algo. La cuenta, por favor pide la cuenta."], ["Für mich einen Kaffee.", "Para mí, un café.", ["La cuenta, por favor.", "¿Tiene pan?", "Muchas gracias."], "Zu „Für mich einen Kaffee.“ passt „Para mí, un café.“. Quisiera ist eine höfliche feste Wendung für ich hätte gern. Para mí ... bestellt für sich. La cuenta, por favor bittet um die Rechnung. / Quisiera es una fórmula de cortesía. Para mí sirve para pedir algo. La cuenta, por favor pide la cuenta."], ["Die Rechnung, bitte.", "La cuenta, por favor.", ["¿Tiene pan?", "Muchas gracias.", "Quisiera agua."], "Zu „Die Rechnung, bitte.“ passt „La cuenta, por favor.“. Quisiera ist eine höfliche feste Wendung für ich hätte gern. Para mí ... bestellt für sich. La cuenta, por favor bittet um die Rechnung. / Quisiera es una fórmula de cortesía. Para mí sirve para pedir algo. La cuenta, por favor pide la cuenta."], ["Haben Sie Brot?", "¿Tiene pan?", ["Muchas gracias.", "Quisiera agua.", "Para mí, un café."], "Zu „Haben Sie Brot?“ passt „¿Tiene pan?“. Quisiera ist eine höfliche feste Wendung für ich hätte gern. Para mí ... bestellt für sich. La cuenta, por favor bittet um die Rechnung. / Quisiera es una fórmula de cortesía. Para mí sirve para pedir Sie hat braune Haare.", "Tiene el pelo castaño.", ["Son simpáticos.", "Él es alto.", "Ella es alta."], "Zu „Sie hat braune Haare.“ passt „Tiene el pelo castaño.“. Ser und Adjektive beschreiben Eigenschaften. Tener beschreibt unter anderem Haare und Augen. Achte auf Genus und Zahl: ojos verdes. / Ser con adjetivos expresa características; tener describe, entre otras cosas, pelo y ojos."], ["Sie sind freundlich. (gemischt)", "Son simpáticos.", ["Él es alto.", "Ella es alta.", "Tiene ojos verdes."], "Zu „Sie sind freundlich. (gemischt)“ passt „Son simpáticos.“. Ser und Adjektive beschreiben Eigenschaften. Tener beschreibt unter anderem Haare und Augen. Achte auf Genus und Zahl: ojos verdes. / Ser con adjetivos expresa características; tener describe, entre otras cosas, pelo y ojos."]]], ["Pronombres de objeto · Objektpronomen", "Lo/la ersetzen ein direktes Objekt im Singular, los/las im Plural. Sie stehen normalerweise vor dem konjugierten Verb: leo el libro → lo leo.", "Lo, la, los y las sustituyen el objeto directo y suelen ir antes del verbo conjugado.", [["Leo el libro. → ___ leo.", "Lo", ["La", "Los", "Las"], "Zu „Leo el libro. → ___ leo.“ passt „Lo“. Lo/la ersetzen ein direktes Objekt im Singular, los/las im Plural. Sie stehen normalerweise vor dem konjugierten Verb: leo el libro → lo leo. / Lo, la, los y las sustituyen el objeto directo y suelen ir antes del verbo conjugado."], ["Leo la carta. → ___ leo.", "La", ["Los", "Las", "Lo"], "Zu „Leo la carta. → ___ leo.“ passt „La“. Lo/la ersetzen ein direktes Objekt im Singular, los/las im Plural. Sie stehen normalerweise vor dem konjugierten Verb: leo el libro → lo leo. / Lo, la, los y las sustituyen el objeto directo y suelen ir antes del verbo conjugado."], ["Leo los libros. → ___ leo.", "Los", ["Las", "Lo", "La"], "Zu „Leo los libros. → ___ leo.“ passt „Los“. Lo/la ersetzen ein direktes Objekt im Singular, los/las im Plural. Sie stehen normalerweise vor dem konjugierten Verb: leo el libro → lo leo. / Lo, la, los y las sustituyen el objeto directo y suelen ir antes del verbo conjugado."], ["Leo las cartas. → ___ leo.", "Las", ["Lo", "La", "Los"], "Zu „Leo las cartas. → ___ leo.“ passt „Las“. Lo/la ersetzen ein direktes Objekt im Singular, los/las im Plural. Sie stehen normalerweise vor dem konjugierten Verb: leo el libro → lo leo. / Lo, la, los y las sustituyen el objeto directo y suelen ir antes del verbo conjugado."]]], ["Más verbos frecuentes · Häufige Verben", "Saber, venir und decir haben unregelmäßige Formen: sé, vengo, digo. Übe zunächst nur die Formen für yo, tú, él/ella.", "Saber, venir y decir son irregulares. Practicamos primero yo, tú, él/ella.", [["Yo ___ español. (saber)", "sé", ["sabes", "viene", "vengo"], "Zu „Yo ___ español. (saber)“ passt „sé“. Saber, venir und decir haben unregelmäßige Formen: sé, vengo, digo. Übe zunächst nur die Formen für yo, tú, él/ella. / Saber, venir y decir son irregulares. Practicamos primero yo, tú, él/ella."], ["Tú ___ español. (saber)", "sabes", ["sé", "viene", "vengo"], "Zu „Tú ___ español. (saber)“ passt „sabes“. Saber, venir und decir haben unregelmäßige Formen: sé, vengo, digo. Übe zunächst nur die Formen für yo, tú, él/ella. / Saber, venir y decir son irregulares. Practicamos primero yo, tú, él/ella."], ["Ella ___ a casa. (venir)", "viene", ["vengo", "sé", "sabes"], "Zu „Ella ___ a casa. (venir)“ passt „viene“. Saber, venir und decir haben unregelmäßige Formen: sé, vengo, digo. Übe zunächst nur die Formen für yo, tú, él/ella. / Saber, venir y decir son irregulares. Practicamos primero yo, tú, él/ella."], ["Yo ___ a casa. (venir)", "vengo", ["viene", "sé", "sabes"], "Zu „Yo ___ a casa. (venir)“ passt „vengo“. Saber, venir und decir haben unregelmäßige Formen: sé, vengo, digo. Übe zunächst nur die Formen für yo, tú, él/ella. / Saber, venir y decir son irregulares. Practicamos primero yo, tú, él/ella."], ["Yo ___ hola. (decir)", "digo", ["dices", "sé", "sabes"], "Zu „Yo ___ hola. (decir)“ passt „digo“. Saber, venir und decir haben unregelmäßige Formen: sé, vengo, digo. Übe zunächst nur die Formen für yo, tú, él/ella. / Saber, venir y decir son irregulares. Practicamos primero yo, tú, él/ella."], ["Tú ___ hola. (decir)", "dices", ["digo", "sé", "sabes"], "Zu „Tú ___ hola. (decir)“ passt „dices“. Saber, venir und decir haben unregelmäßige Formen: sé, vengo, digo. Übe zunächst nur die Formen für yo, tú, él/ella. / Saber, venir y decir son irregulares. Practicamos primero yo, tú, él/ella."]]], ["Diálogo · Presentarse", "Lies die Frage und wähle eine passende Antwort. Achte darauf, wonach gefragt wird: Name, Herkunft, Wohnort oder Alter.", "Lee la pregunta y elige una respuesta adecuada: nombre, origen, residencia o edad.", [["¿Cómo te llamas?", "Me llamo Alex.", ["Soy de Alemania.", "Vivo en Berlín.", "Tengo veinte años."], "Zu „¿Cómo te llamas?“ passt „Me llamo Alex.“. Lies die Frage und wähle eine passende Antwort. Achte darauf, wonach gefragt wird: Name, Herkunft, Wohnort oder Alter. / Lee la pregunta y elige una respuesta adecuada: nombre, origen, residencia o edad."], ["¿De dónde eres?", "Soy de Alemania.", ["Vivo en Berlín.", "Tengo veinte años.", "Estoy bien."], "Zu „¿De dónde eres?“ passt „Soy de Alemania.“. Lies die Frage und wähle eine passende Antwort. Achte darauf, wonach gefragt wird: Name, Herkunft, Wohnort oder Alter. / Lee la pregunta y elige una respuesta adecuada: nombre, origen, residencia o edad."], ["¿Dónde vives?", "Vivo en Berlín.", ["Tengo veinte años.", "Estoy bien.", "Me llamo Alex."], "Zu „¿Dónde vives?“ passt „Vivo en Berlín.“. Lies die Frage und wähle eine passende Antwort. Achte darauf, wonach gefragt wird: Name, Herkunft, Wohnort oder Alter. / Lee la pregunta y elige una respuesta adecuada: nombre, origen, residencia o edad."], ["¿Cuántos años tienes?", "Tengo veinte años.", ["Estoy bien.", "Me llamo Alex.", "Soy de Alemania."], "Zu „¿Cuántos años tienes?“ passt „Tengo veinte años.“. Lies die Frage und wähle eine passende Antwort. Achte darauf, wonach gefragt wird: Name, Herkunft, Wohnort oder Alter. / Lee la pregunta y elige una respuesta adecuada: nombre, origen, residencia o edad."], ["¿Cómo estás?", "Estoy bien.", ["Me llamo Alex.", "Soy de Alemania.", "Vivo en Berlín."], "Zu „¿Cómo estás?“ passt „Estoy bien.“. Lies die Frage und wähle eine passende Antwort. Achte darauf, wonach gefragt wird: Name, Herkunft, Wohnort oder Alter. / Lee la pregunta y elige una respuesta adecuada: nombre, origen, residencia o edad."]]], ["Diálogo · Una cita", "Lies die Fragen zu einem Treffen. Wann, wo und was sind verschiedene Informationen. Wähle eine passende Antwort.", "Lee las preguntas sobre una cita. Distingue cuándo, dónde y qué.", [["¿A qué hora vamos al cine?", "A las siete.", ["Estoy en casa.", "Quiero arroz.", "Sí, puedo."], "Zu „¿A qué hora vamos al cine?“ passt „A las siete.“. Lies die Fragen zu einem Treffen. Wann, wo und was sind verschiedene Informationen. Wähle eine passende Antwort. / Lee las preguntas sobre una cita. Distingue cuándo, dónde y qué."], ["¿Dónde estás?", "Estoy en casa.", ["Quiero arroz.", "Sí, puedo.", "Voy a estudiar."], "Zu „¿Dónde estás?“ passt „Estoy en casa.“. Lies die Fragen zu einem Treffen. Wann, wo und was sind verschiedene Informationen. Wähle eine passende Antwort. / Lee las preguntas sobre una cita. Distingue cuándo, dónde y qué."], ["¿Qué quieres comer?", "Quiero arroz.", ["Sí, puedo.", "Voy a estudiar.", "A las siete."], "Zu „¿Qué quieres comer?“ passt „Quiero arroz.“. Lies die Fragen zu einem Treffen. Wann, wo und was sind verschiedene Informationen. Wähle eine passende Antwort. / Lee las preguntas sobre una cita. Distingue cuándo, dónde y qué."], ["¿Puedes venir mañana?", "Sí, puedo.", ["Voy a estudiar.", "A las siete.", "Estoy en casa."], "Zu „¿Puedes venir mañana?“ passt „Sí, puedo.“. Lies die Fragen zu einem Treffen. Wann, wo und was sind verschiedene Informationen. Wähle eine passende Antwort. / Lee las preguntas sobre una cita. Distingue cuándo, dónde y qué."], ["¿Qué vas a hacer mañana?", "Voy a estudiar.", ["A las siete.", "Estoy en casa.", "Quiero arroz."], "Zu „¿Qué vas a hacer mañana?“ passt „Voy a estudiar.“. Lies die Fragen zu einem Treffen. Wann, wo und was sind verschiedene Informationen. Wähle eine passende Antwort. / Lee las preguntas sobre una cita. Distingue cuándo, dónde y qué."]]]]);
RULES.push(...[["Despedidas · Abschied", "Verabschiedungen hängen vom Zeitpunkt ab: hasta luego ist unverbindlich, hasta mañana nennt morgen. Adiós ist ein allgemeiner Abschied.", "Usamos adiós para despedirnos, hasta luego para vernos después y hasta mañana para el día siguiente.", ["Aufgabe · Contexto", "Español"], [["Auf Wiedersehen", "adiós"], ["Bis später", "hasta luego"], ["Bis morgen", "hasta mañana"], ["Bis bald", "hasta pronto"]]], ["Pronunciación · Aussprache", "Die fünf Vokale bleiben meist klar und kurz. H ist stumm, ñ klingt etwa wie nj, ll in vielen Regionen wie deutsches j. J klingt ungefähr wie ch in Bach. Höre die Beispiele.", "Las cinco vocales suelen ser claras. La h es muda; la ñ suena como en niño; la ll suele sonar como y; la j tiene sonido fuerte.", ["Aufgabe · Contexto", "Español"], [["Buchstabe ohne eigenen Laut in hola", "h"], ["Laut nj in niño", "ñ"], ["Laut wie ch in Bach in jabón", "j"], ["Vokal in mesa", "e"], ["Vokal in luna", "u"]]], ["Números 11–20 · Zahlen", "11 bis 15 haben eigene Formen. 16 bis 19 beginnen mit dieci-. 20 heißt veinte. Achte auf den Akzent in dieciséis.", "Del 11 al 15 hay formas propias. Del 16 al 19 usamos dieci-. El 20 es veinte.", ["Aufgabe · Contexto", "Español"], [["11", "once"], ["12", "doce"], ["13", "trece"], ["14", "catorce"], ["15", "quince"], ["16", "dieciséis"], ["17", "diecisiete"], ["18", "dieciocho"], ["19", "diecinueve"], ["20", "veinte"]]], ["Números 21–50 · Zahlen", "21–29 schreibt man zusammen. Ab 31 verbindet y Zehner und Einer: treinta y uno. Die Zahl 100 allein heißt cien.", "Del 21 al 29 escribimos una palabra. Desde el 31 unimos decenas y unidades con y. 100 solo es cien.", ["Aufgabe · Contexto", "Español"], [["21", "veintiuno"], ["22", "veintidós"], ["30", "treinta"], ["31", "treinta y uno"], ["40", "cuarenta"], ["50", "cincuenta"]]], ["Números 60–100 · Zahlen", "21–29 schreibt man zusammen. Ab 31 verbindet y Zehner und Einer: treinta y uno. Die Zahl 100 allein heißt cien.", "Del 21 al 29 escribimos una palabra. Desde el 31 unimos decenas y unidades con y. 100 solo es cien.", ["Aufgabe · Contexto", "Español"], [["60", "sesenta"], ["70", "setenta"], ["80", "ochenta"], ["90", "noventa"], ["100", "cien"]]], ["Género y artículos · Genus", "Substantive haben ein grammatisches Geschlecht. Viele Wörter auf -o sind maskulin, viele auf -a feminin; es gibt Ausnahmen. Lerne den Artikel mit dem Wort.", "Los sustantivos tienen género. Muchos terminan en -o o -a, pero hay excepciones. Aprende cada palabra con su artículo.", ["Aufgabe · Contexto", "Español"], [["der Kater", "el gato"], ["das Haus", "la casa"], ["das Buch", "el libro"], ["der Tisch", "la mesa"], ["die Hand (Ausnahme)", "la mano"], ["der Tag (Ausnahme)", "el día"]]], ["Plural de sustantivos · Mehrzahl", "Nach Vokal kommt meist -s, nach Konsonant meist -es; z wird vor -es zu c. Der Artikel ändert sich auch, das folgt in der nächsten Lektion.", "Añadimos normalmente -s tras vocal y -es tras consonante. La z cambia a c antes de -es.", ["Aufgabe · Contexto", "Español"], [["gato → Plural", "gatos"], ["casa → Plural", "casas"], ["papel → Plural", "papeles"], ["reloj → Plural", "relojes"], ["luz → Plural", "luces"], ["flor → Plural", "flores"]]], ["Artículos plurales · Mehrzahl", "El wird los, la wird las. Artikel und Nomen stimmen in Zahl und Geschlecht überein.", "El cambia a los y la a las. El artículo concuerda con el sustantivo.", ["Aufgabe · Contexto", "Español"], [["el gato → plural", "los gatos"], ["la casa → plural", "las casas"], ["el libro → plural", "los libros"], ["la mesa → plural", "las mesas"], ["la flor → plural", "las flores"]]], ["Un, una, unos, unas · Unbestimmte Artikel", "Un und una bedeuten ein/eine. Unos und unas bedeuten einige. Anders als el/la bezeichnet der unbestimmte Artikel etwas nicht näher Bestimmtes.", "Un y una presentan algo no determinado; unos y unas indican algunos o algunas.", ["Aufgabe · Contexto", "Español"], [["ein Buch", "un libro"], ["ein Haus", "una casa"], ["einige Bücher", "unos libros"], ["einige Häuser", "unas casas"], ["eine Blume", "una flor"]]], ["Pronombres plurales · Personalpronomen", "Nosotros ist wir für männliche oder gemischte Gruppen, nosotras für weibliche. Ellos/ellas bedeutet sie. In Lateinamerika ist ustedes die übliche Pluralanrede; in Spanien oft vosotros/vosotras informell. Usted ist höfliches Sie im Singular.", "Nosotros/nosotras significa wir; ellos/ellas significa sie. En América usamos ustedes; en España también vosotros/vosotras. Usted es el trato formal singular.", ["Aufgabe · Contexto", "Español"], [["wir (gemischt)", "nosotros"], ["wir (nur Frauen)", "nosotras"], ["sie (gemischt)", "ellos"], ["sie (nur Frauen)", "ellas"], ["ihr (Lateinamerika)", "ustedes"], ["ihr (Spanien, gemischt, informell)", "vosotros"], ["Sie (eine Person, höflich)", "usted"]]], ["Ser plural · Mehrzahl", "Zu nosotros gehört somos, zu vosotros sois, zu ellos/ellas/ustedes son. Usted verwendet es. Ser beschreibt hier Identität und Herkunft.", "Nosotros somos, vosotros sois, ellos/ellas/ustedes son. Usted es. Usamos ser para identidad y origen.", ["Aufgabe · Contexto", "Español"], [["Nosotros ___ de Ecuador.", "somos"], ["Vosotros ___ de España.", "sois"], ["Ellas ___ de Alemania.", "son"], ["Ustedes ___ estudiantes.", "son"], ["Usted ___ de Berlín.", "es"]]], ["Estar plural · Mehrzahl", "Zu nosotros gehört estamos, zu vosotros estáis, zu ellos/ellas/ustedes están. Usted verwendet está. Beachte die Akzente.", "Nosotros estamos, vosotros estáis, ellos/ellas/ustedes están. Usted está. Recuerda las tildes.", ["Aufgabe · Contexto", "Español"], [["Nosotros ___ en casa.", "estamos"], ["Vosotros ___ aquí.", "estáis"], ["Ellos ___ en Berlín.", "están"], ["Ustedes ___ en casa.", "están"], ["Usted ___ aquí.", "está"]]], ["Ser o estar · Unterschied", "Für Herkunft, Identität und Beruf meist ser; für den Aufenthaltsort von Personen und momentane Zustände meist estar. Nicht einfach dauerhaft gegen vorübergehend: die Bedeutung ist entscheidend.", "Ser expresa identidad, origen o profesión; estar expresa ubicación de personas y estados. No basta distinguir permanente y temporal.", ["Aufgabe · Contexto", "Español"], [["Yo ___ de Ecuador.", "soy"], ["Yo ___ en Alemania.", "estoy"], ["Ella ___ profesora.", "es"], ["Ella ___ cansada.", "está"], ["Nosotros ___ estudiantes.", "somos"], ["Nosotros ___ en casa.", "estamos"]]], ["Adjetivos · Adjektive", "Viele Adjektive auf -o ändern sich zu -a bei femininen Nomen. Bei anderen, etwa grande, bleibt die Form gleich. Im Plural kommt meist -s oder -es. Adjektive stehen häufig nach dem Nomen.", "Muchos adjetivos en -o cambian a -a. Otros, como grande, no cambian de género. Concuerdan también en número.", ["Aufgabe · Contexto", "Español"], [["el gato (schwarz)", "negro"], ["la gata (schwarz)", "negra"], ["los gatos (schwarz)", "negros"], ["las gatas (schwarz)", "negras"], ["la casa (groß)", "grande"], ["las casas (groß)", "grandes"]]], ["Presente -ar plural · Mehrzahl", "Bei hablar: Stamm habl- plus -amos, -áis, -an. Ustedes verwendet dieselbe Form wie ellos. Das Präsens beschreibt Gewohnheiten und aktuelle Handlungen.", "Con hablar usamos habl- y las terminaciones -amos, -áis, -an. Ustedes usa la tercera persona plural.", ["Aufgabe · Contexto", "Español"], [["Nosotros ___ español. (hablar)", "hablamos"], ["Vosotros ___ español. (hablar)", "habláis"], ["Ellos ___ español. (hablar)", "hablan"], ["Ustedes ___ música. (escuchar)", "escuchan"], ["Nosotras ___ español. (estudiar)", "estudiamos"]]], ["Presente -er singular · Einzahl", "Entferne -er und füge -o, -es, -e hinzu. Beispiel comer: como, comes, come. Anders als bei -ar steht e in der zweiten und dritten Person.", "Quitamos -er y añadimos -o, -es, -e: como, comes, come.", ["Aufgabe · Contexto", "Español"], [["Yo ___ pan. (comer)", "como"], ["Tú ___ pan. (comer)", "comes"], ["Ella ___ pan. (comer)", "come"], ["Yo ___ agua. (beber)", "bebo"], ["Tú ___ agua. (beber)", "bebes"], ["Él ___ agua. (beber)", "bebe"]]], ["Presente -er plural · Mehrzahl", "Für -er lauten die Pluralendungen -emos, -éis, -en. Beispiel comer: comemos, coméis, comen.", "En plural, los verbos -er terminan en -emos, -éis, -en.", ["Aufgabe · Contexto", "Español"], [["Nosotros ___ pan. (comer)", "comemos"], ["Vosotros ___ pan. (comer)", "coméis"], ["Ellos ___ pan. (comer)", "comen"], ["Ustedes ___ agua. (beber)", "beben"], ["Nosotras ___ agua. (beber)", "bebemos"]]], ["Presente -ir singular · Einzahl", "Bei regelmäßigen -ir-Verben sind die Singularendungen wie bei -er: -o, -es, -e. Beispiel vivir: vivo, vives, vive.", "Los verbos regulares en -ir usan -o, -es, -e en singular.", ["Aufgabe · Contexto", "Español"], [["Yo ___ en Alemania. (vivir)", "vivo"], ["Tú ___ en Berlín. (vivir)", "vives"], ["Ella ___ en Ecuador. (vivir)", "vive"], ["Yo ___ una carta. (escribir)", "escribo"], ["Tú ___ una carta. (escribir)", "escribes"], ["Él ___ una carta. (escribir)", "escribe"]]], ["Presente -ir plural · Mehrzahl", "Bei -ir: -imos, -ís, -en. Vergleiche -er: -emos, -éis, -en. Die dritte Person Plural ist gleich.", "Los verbos en -ir usan -imos, -ís, -en; la tercera persona plural coincide con -er.", ["Aufgabe · Contexto", "Español"], [["Nosotros ___ aquí. (vivir)", "vivimos"], ["Vosotros ___ aquí. (vivir)", "vivís"], ["Ellos ___ aquí. (vivir)", "viven"], ["Nosotras ___ cartas. (escribir)", "escribimos"], ["Ustedes ___ cartas. (escribir)", "escriben"]]], ["Negación · Verneinung", "No steht unmittelbar vor dem konjugierten Verb. Anders als deutsches nicht steht es nicht am Satzende.", "Colocamos no delante del verbo conjugado.", ["Aufgabe · Contexto", "Español"], [["Ich spreche nicht.", "No hablo."], ["Ich esse nicht.", "No como."], ["Ich bin nicht zu Hause.", "No estoy en casa."], ["Ich bin nicht aus Spanien.", "No soy de España."]]], ["Preguntas · Fragen", "Ja/Nein-Fragen können dieselbe Wortstellung wie Aussagen haben; die Stimme und die Fragezeichen zeigen die Frage. Fragewörter tragen einen Akzent.", "Las preguntas de sí o no pueden conservar el orden de una afirmación. Usamos ¿ y ?. Los interrogativos llevan tilde.", ["Aufgabe · Contexto", "Español"], [["Was?", "¿Qué?"], ["Wer?", "¿Quién?"], ["Wo?", "¿Dónde?"], ["Wie?", "¿Cómo?"], ["Wann?", "¿Cuándo?"], ["Warum?", "¿Por qué?"], ["Wie viel?", "¿Cuánto?"]]], ["Tener · Haben", "Tener ist unregelmäßig: tengo, tienes, tiene, tenemos, tenéis, tienen. Im Spanischen sagt man auch tengo ... años für das Alter.", "Tener es irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. La edad se expresa con tener.", ["Aufgabe · Contexto", "Español"], [["Yo ___ un libro.", "tengo"], ["Tú ___ veinte años.", "tienes"], ["Ella ___ una casa.", "tiene"], ["Nosotros ___ libros.", "tenemos"], ["Vosotros ___ tiempo.", "tenéis"], ["Ellos ___ tiempo.", "tienen"]]], ["Edad y datos personales · Persönliche Angaben", "Mit me llamo sagst du deinen Namen; tengo ... años nennt dein Alter; vivo en nennt deinen Wohnort. Lerne die Ausdrücke als feste Bausteine.", "Me llamo introduce el nombre, tengo ... años la edad y vivo en el lugar de residencia.", ["Aufgabe · Contexto", "Español"], [["Ich heiße Alex.", "Me llamo Alex."], ["Ich bin zwanzig Jahre alt.", "Tengo veinte años."], ["Ich wohne in Berlin.", "Vivo en Berlín."], ["Wo wohnst du?", "¿Dónde vives?"], ["Wie heißt du?", "¿Cómo te llamas?"]]], ["Familia · Familie", "Lerne Familienwörter mit ihren Artikeln. Hermano/hermana ändern das Genus; padre und madre sind unterschiedliche Wörter.", "Aprende el vocabulario familiar con su artículo. Hermano y hermana cambian el género.", ["Aufgabe · Contexto", "Español"], [["der Vater", "el padre"], ["die Mutter", "la madre"], ["der Bruder", "el hermano"], ["die Schwester", "la hermana"], ["der Sohn", "el hijo"], ["die Tochter", "la hija"], ["die Familie", "la familia"], ["der Partner", "la pareja"]]], ["Posesivos · Besitz", "Mi, tu, su richten sich in der Zahl nach dem Besitz: mi libro, mis libros. Nuestro/nuestra stimmt auch im Genus überein. Su kann sein, ihr oder Ihr bedeuten.", "Mi, tu, su concuerdan en número con lo poseído. Nuestro concuerda también en género. Su tiene varios significados.", ["Aufgabe · Contexto", "Español"], [["mein Buch", "mi libro"], ["meine Bücher", "mis libros"], ["dein Haus", "tu casa"], ["deine Häuser", "tus casas"], ["sein/ihr Haus", "su casa"], ["unsere Familie", "nuestra familia"], ["unsere Bücher", "nuestros libros"]]], ["Colores · Farben", "Rojo, blanco, negro und amarillo passen sich in Genus und Zahl an. Verde und azul ändern das Genus nicht; im Plural verdes, azules.", "Rojo, blanco, negro y amarillo concuerdan en género y número; verde y azul no cambian de género.", ["Aufgabe · Contexto", "Español"], [["rot (maskulin)", "rojo"], ["rot (feminin)", "roja"], ["weiß (maskulin)", "blanco"], ["schwarz (feminin)", "negra"], ["gelb (maskulin)", "amarillo"], ["grün", "verde"], ["blau", "azul"]]], ["Días · Wochentage", "Wochentage und Monate werden normalerweise kleingeschrieben. Für am Montag sagt man el lunes; en enero bedeutet im Januar.", "Los días y meses se escriben normalmente con minúscula. El lunes significa am Montag; en enero, im Januar.", ["Aufgabe · Contexto", "Español"], [["Montag", "lunes"], ["Dienstag", "martes"], ["Mittwoch", "miércoles"], ["Donnerstag", "jueves"], ["Freitag", "viernes"], ["Samstag", "sábado"], ["Sonntag", "domingo"]]], ["Meses 1 · Januar–Juni", "Wochentage und Monate werden normalerweise kleingeschrieben. Für am Montag sagt man el lunes; en enero bedeutet im Januar.", "Los días y meses se escriben normalmente con minúscula. El lunes significa am Montag; en enero, im Januar.", ["Aufgabe · Contexto", "Español"], [["Januar", "enero"], ["Februar", "febrero"], ["März", "marzo"], ["April", "abril"], ["Mai", "mayo"], ["Juni", "junio"]]], ["Meses 2 · Juli–Dezember", "Wochentage und Monate werden normalerweise kleingeschrieben. Für am Montag sagt man el lunes; en enero bedeutet im Januar.", "Los días y meses se escriben normalmente con minúscula. El lunes significa am Montag; en enero, im Januar.", ["Aufgabe · Contexto", "Español"], [["Juli", "julio"], ["August", "agosto"], ["September", "septiembre"], ["Oktober", "octubre"], ["November", "noviembre"], ["Dezember", "diciembre"]]], ["La hora · Uhrzeit", "Bei eins verwendet man es la una, sonst son las. Y ergänzt Minuten; y media bedeutet halb nach, y cuarto Viertel nach. A las nennt einen Zeitpunkt.", "Decimos es la una y son las demás horas. Y media significa treinta minutos, y cuarto quince. A las indica la hora de un evento.", ["Aufgabe · Contexto", "Español"], [["1:00", "Es la una."], ["2:00", "Son las dos."], ["3:15", "Son las tres y cuarto."], ["4:30", "Son las cuatro y media."], ["um fünf Uhr", "a las cinco"], ["Wie spät ist es?", "¿Qué hora es?"]]], ["Hay y estar · Existenz und Ort", "Hay bedeutet es gibt und bleibt auch im Plural unverändert. Estar lokalisiert etwas Bekanntes: Hay un libro. El libro está en la mesa.", "Hay expresa existencia y no cambia en plural. Estar indica dónde está algo identificado.", ["Aufgabe · Contexto", "Español"], [["Es gibt ein Buch.", "Hay un libro."], ["Es gibt zwei Bücher.", "Hay dos libros."], ["Das Buch ist auf dem Tisch.", "El libro está en la mesa."], ["Die Bücher sind auf dem Tisch.", "Los libros están en la mesa."]]], ["Preposiciones de lugar · Ortsangaben", "En bedeutet in, an oder auf je nach Kontext. Encima de, debajo de, al lado de, delante de und detrás de präzisieren die Lage. De + el wird del.", "En indica ubicación general; encima de, debajo de, al lado de, delante de y detrás de precisan la posición. De + el = del.", ["Aufgabe · Contexto", "Español"], [["auf (oberhalb von)", "encima de"], ["unterhalb von", "debajo de"], ["neben", "al lado de"], ["vor", "delante de"], ["hinter", "detrás de"], ["in der Küche", "en la cocina"]]], ["Comida y bebida · Essen und Trinken", "Lerne die Lebensmittel mit Artikeln. Agua ist feminin, verwendet aber im Singular el wegen des betonten a: el agua fría.", "Aprende los alimentos con artículos. Agua es femenino, pero en singular se dice el agua fría.", ["Aufgabe · Contexto", "Español"], [["das Brot", "el pan"], ["das Wasser", "el agua"], ["der Kaffee", "el café"], ["der Reis", "el arroz"], ["die Milch", "la leche"], ["der Apfel", "la manzana"], ["das Gemüse", "la verdura"], ["das Hähnchen", "el pollo"]]], ["Gustar · Mögen", "Gustar funktioniert wie gefallen: me gusta el café, me gustan los libros. Die Verbform richtet sich nach dem, was gefällt. Me, te, le bezeichnen die Person.", "Gustar concuerda con lo que gusta: me gusta el café, me gustan los libros. Me, te, le indican a quién.", ["Aufgabe · Contexto", "Español"], [["Ich mag Kaffee.", "Me gusta el café."], ["Ich mag Bücher.", "Me gustan los libros."], ["Du magst Reis.", "Te gusta el arroz."], ["Sie mag Äpfel.", "Le gustan las manzanas."], ["Ich esse gern.", "Me gusta comer."]]], ["Querer · Wollen", "Querer hat einen Stammwechsel e → ie außer bei nosotros und vosotros: quiero, quieres, quiere, queremos, queréis, quieren. Danach kann ein Infinitiv stehen.", "Querer cambia e por ie excepto con nosotros y vosotros. Puede ir seguido de infinitivo.", ["Aufgabe · Contexto", "Español"], [["Yo ___ agua.", "quiero"], ["Tú ___ comer.", "quieres"], ["Ella ___ café.", "quiere"], ["Nosotros ___ estudiar.", "queremos"], ["Vosotros ___ pan.", "queréis"], ["Ellos ___ comer.", "quieren"]]], ["Poder · Können", "Poder hat o → ue außer bei nosotros und vosotros: puedo, puedes, puede, podemos, podéis, pueden. Das folgende Verb bleibt im Infinitiv.", "Poder cambia o por ue excepto con nosotros y vosotros. El verbo siguiente va en infinitivo.", ["Aufgabe · Contexto", "Español"], [["Yo ___ hablar.", "puedo"], ["Tú ___ comer.", "puedes"], ["Ella ___ estudiar.", "puede"], ["Nosotros ___ hablar.", "podemos"], ["Vosotros ___ venir.", "podéis"], ["Ellos ___ vivir aquí.", "pueden"]]], ["Ir · Gehen und Fahren", "Ir ist unregelmäßig: voy, vas, va, vamos, vais, van. Ziel mit a; a + el wird al. Ir a + Infinitiv drückt einen Plan aus.", "Ir es irregular. Usamos a para el destino; a + el = al. Ir a + infinitivo expresa planes.", ["Aufgabe · Contexto", "Español"], [["Yo ___ a casa.", "voy"], ["Tú ___ al mercado.", "vas"], ["Ella ___ a Berlín.", "va"], ["Nosotros ___ al cine.", "vamos"], ["Vosotros ___ a casa.", "vais"], ["Ellos ___ a estudiar.", "van"]]], ["Hacer · Machen", "Hacer hat nur in der ersten Person Singular eine besonders unregelmäßige Form: hago. Danach haces, hace, hacemos, hacéis, hacen.", "Hacer tiene la forma irregular hago. Las demás son haces, hace, hacemos, hacéis, hacen.", ["Aufgabe · Contexto", "Español"], [["Yo ___ la comida.", "hago"], ["Tú ___ deporte.", "haces"], ["Ella ___ la tarea.", "hace"], ["Nosotros ___ deporte.", "hacemos"], ["Vosotros ___ la comida.", "hacéis"], ["Ellos ___ la tarea.", "hacen"]]], ["Rutinas y reflexivos · Alltag", "Bei reflexiven Verben steht me, te, se, nos, os, se vor dem Verb. Levantarse wird me levanto, te levantas usw. Das Pronomen gehört zur Person.", "Los reflexivos usan me, te, se, nos, os, se antes del verbo conjugado.", ["Aufgabe · Contexto", "Español"], [["Ich stehe auf.", "Me levanto."], ["Du stehst auf.", "Te levantas."], ["Sie steht auf.", "Se levanta."], ["Wir stehen auf.", "Nos levantamos."], ["Ihr steht auf (Spanien).", "Os levantáis."], ["Sie stehen auf.", "Se levantan."]]], ["Frecuencia · Häufigkeit", "Siempre, normalmente, a veces und nunca beschreiben, wie oft etwas passiert. Nunca vor dem Verb braucht kein zusätzliches no.", "Siempre, normalmente, a veces y nunca indican frecuencia. Nunca delante del verbo no necesita no.", ["Aufgabe · Contexto", "Español"], [["immer", "siempre"], ["normalerweise", "normalmente"], ["manchmal", "a veces"], ["nie", "nunca"], ["jeden Tag", "todos los días"]]], ["En el restaurante · Restaurant", "Quisiera ist eine höfliche feste Wendung für ich hätte gern. Para mí ... bestellt für sich. La cuenta, por favor bittet um die Rechnung.", "Quisiera es una fórmula de cortesía. Para mí sirve para pedir algo. La cuenta, por favor pide la cuenta.", ["Aufgabe · Contexto", "Español"], [["Ich hätte gern Wasser.", "Quisiera agua."], ["Für mich einen Kaffee.", "Para mí, un café."], ["Die Rechnung, bitte.", "La cuenta, por favor."], ["Haben Sie Brot?", "¿Tiene pan?"], ["Vielen Dank.", "Muchas gracias."]]], ["Compras · Einkaufen", "Cuánto cuesta fragt nach dem Preis eines Artikels; cuánto cuestan bei mehreren. Este/esta bedeutet dieser/diese. Es richtet sich nach dem Nomen.", "Cuánto cuesta pregunta por un precio singular; cuánto cuestan, por varios. Este y esta concuerdan con el sustantivo.", ["Aufgabe · Contexto", "Español"], [["Wie viel kostet es?", "¿Cuánto cuesta?"], ["Wie viel kosten sie?", "¿Cuánto cuestan?"], ["dieses Buch", "este libro"], ["dieses Haus", "esta casa"], ["Ich möchte das Buch.", "Quiero el libro."]]], ["Direcciones · Wegbeschreibung", "Dónde está fragt nach einem Ort. A la derecha/izquierda geben die Richtung an; todo recto heißt geradeaus. Cerca de bedeutet in der Nähe von.", "Dónde está pregunta por ubicación. A la derecha, a la izquierda y todo recto indican dirección. Cerca de indica proximidad.", ["Aufgabe · Contexto", "Español"], [["Wo ist der Bahnhof?", "¿Dónde está la estación?"], ["nach rechts", "a la derecha"], ["nach links", "a la izquierda"], ["geradeaus", "todo recto"], ["in der Nähe von", "cerca de"], ["weit weg von", "lejos de"]]], ["Tiempo y clima · Wetter", "Für Wetter nutzt man häufig hace frío/calor und hace sol. Llueve bedeutet es regnet. Está nublado beschreibt den Zustand des Himmels.", "Usamos hace frío, hace calor y hace sol. Llueve expresa lluvia y está nublado describe el cielo.", ["Aufgabe · Contexto", "Español"], [["Es ist kalt.", "Hace frío."], ["Es ist heiß.", "Hace calor."], ["Die Sonne scheint.", "Hace sol."], ["Es regnet.", "Llueve."], ["Es ist bewölkt.", "Está nublado."]]], ["Planes · Zukunft mit ir a", "Ir a + Infinitiv beschreibt einen Plan. Nur ir wird konjugiert: voy a comer, vamos a estudiar. Morgen heißt mañana.", "Ir a + function finish(){view('');let pass=score/Q.length>=.8,ids=[...new Set(Q.map(k=>Number(k.split(':')[0])))];app.innerHTML=`<section><span class="pill">Sesión terminada</span><h2>${pass?'¡Excelente! 🌱':'¡Sigue practicando!'}</h2><p>${score} von ${Q.length} richtig (${Math.round(score/Q.length*100)} %).</p><p>${lesson>=0?(pass?'Lektion abgeschlossen!':'Wiederhole die Lektion, um die nächste freizuschalten.'):'Deine Wiederholungen sind gespeichert.'}</p><div class="actions"><button id="home" class="primary">Zum Lernweg</button>${lesson>=0?'<button id="again">Noch einmal</button>':''}</div></section><section><h2>Dein Spickzettel · Tu resumen</h2><p>Die Regeln dieser Sitzung findest du hier wieder.</p>${ids.map(i=>ruleCard(i)).join('')}</section>`;bind('home',home);bind('again',()=>teach(lesson))}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>({home,library,progress}[b.dataset.page])());home();
