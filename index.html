<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> poquito · Español für dich</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#233e35;font:17px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:36px;letter-spacing:-2px}h2{font-size:26px}small{color:#536c61}section{background:white;border:1px solid #e4e6dc;border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 5px 18px #263d3010}button,input{font:inherit;border-radius:12px;padding:14px;border:1px solid #d4ded5}button{cursor:pointer;background:white;color:#233e35;text-align:left}button:hover{background:#e9f4e9}button.primary{background:#286548;color:white;border:0;text-align:center}button:disabled{opacity:.5;cursor:default} .stack{display:grid;gap:10px}.bar{height:8px;background:#e2e8df;border-radius:10px;overflow:hidden}.bar i{display:block;background:#4d9d70;height:100%}.good{background:#e3f4e7}.bad{background:#fff0dc}p{line-height:1.6} .tag{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:#537361} .row{display:flex;gap:10px;flex-wrap:wrap}input{width:100%}</style><main><header><h1>poquito<span style="color:#77a87b">.</span></h1><small id="stats"></small></header><div id="app"></div></main><script>
const L=[
['Saludos · Begrüßungen','Hola heißt Hallo. Buenos días sagt man morgens, buenas tardes nachmittags und buenas noches abends oder zum Abschied vor dem Schlafen.','Usamos hola para saludar. Buenos días por la mañana, buenas tardes por la tarde y buenas noches por la noche.',[['Hallo','Hola',['Adiós','Gracias'],'Hola ist ein Gruß; adiós ist ein Abschied. / Hola es un saludo.'],['Guten Morgen','Buenos días',['Buenas noches','Buenas tardes'],'Días gehört zum Morgengruß. / Buenos días se usa por la mañana.'],['Gute Nacht','Buenas noches',['Buenos días','Hasta luego'],'Noches bedeutet Nächte. / Buenas noches se usa por la noche.']]],
['Cortesía · Höflichkeit','Gracias bedeutet Danke; por favor bedeutet bitte bei einer Bitte; de nada ist die Antwort auf gracias.','Gracias expresa agradecimiento. Por favor acompaña una petición. De nada responde a gracias.',[['Danke','Gracias',['Por favor','De nada'],'Gracias drückt Dank aus. / Expresa agradecimiento.'],['Bitte, bei einer Bitte','Por favor',['Gracias','Hasta luego'],'Por favor begleitet eine Bitte. / Acompaña una petición.'],['Antwort auf Gracias','De nada',['Hola','Por favor'],'De nada entspricht gern geschehen. / Es una respuesta a gracias.']]],
['Números 0–5 · Zahlen','Cero, uno, dos, tres, cuatro, cinco. Lerne zunächst nur diese sechs Zahlen.','Cero, uno, dos, tres, cuatro, cinco.',[['2','dos',['tres','uno'],'Dos bedeutet zwei. / Dos es 2.'],['4','cuatro',['cinco','tres'],'Cuatro bedeutet vier. / Cuatro es 4.'],['0','cero',['uno','cinco'],'Cero bedeutet null. / Cero es 0.'],['5','cinco',['cuatro','dos'],'Cinco bedeutet fünf. / Cinco es 5.']]],
['Números 6–10 · Zahlen','Seis, siete, ocho, nueve, diez.','Seis, siete, ocho, nueve, diez.',[['7','siete',['seis','nueve'],'Siete bedeutet sieben. / Siete es 7.'],['8','ocho',['diez','seis'],'Ocho bedeutet acht. / Ocho es 8.'],['10','diez',['nueve','siete'],'Diez bedeutet zehn. / Diez es 10.']]],
['Pronombres · Personalpronomen','Yo = ich, tú = du, él = er, ella = sie, nosotros/nosotras = wir. Im Spanischen lässt man das Subjekt oft weg.','Yo, tú, él, ella, nosotros/nosotras. Muchas veces omitimos el pronombre.',[['ich','yo',['tú','él'],'Yo bezeichnet den Sprecher. / Yo indica quien habla.'],['du','tú',['yo','ella'],'Tú spricht eine Person direkt an. / Tú se refiere al interlocutor.'],['wir (gemischte Gruppe)','nosotros',['ella','tú'],'Nosotros ist die erste Person Plural. / Primera persona plural.']]],
['Ser · Identität','Ser beschreibt unter anderem Identität und Herkunft: yo soy, tú eres, él/ella es.','Ser expresa identidad y origen: yo soy, tú eres, él/ella es.',[['Yo ___ de Alemania.','soy',['eres','es'],'Zu yo gehört soy. / Con yo usamos soy.'],['Tú ___ estudiante.','eres',['es','soy'],'Zu tú gehört eres. / Con tú usamos eres.'],['Ella ___ de Ecuador.','es',['soy','eres'],'Zu ella gehört es. / Con ella usamos es.']]],
['Estar · Zustand und Ort','Estar beschreibt unter anderem Aufenthaltsort und Zustand: yo estoy, tú estás, él/ella está.','Estar expresa ubicación y estado: yo estoy, tú estás, él/ella está.',[['Yo ___ en casa.','estoy',['soy','estás'],'Ein Aufenthaltsort verlangt estar. / Para ubicación usamos estar.'],['Tú ___ cansado.','estás',['eres','estoy'],'Estar beschreibt hier den Zustand. / Estar expresa el estado.'],['Ella ___ en Berlín.','está',['es','estás'],'Ort und dritte Person: está. / Ubicación y tercera persona: está.']]],
['Presente -ar · Gegenwart','Bei regelmäßigen Verben auf -ar: hablar → hablo, hablas, habla.','Quitamos -ar y añadimos -o, -as, -a: hablo, hablas, habla.',[['Yo ___ español. (hablar)','hablo',['hablas','habla'],'Yo bekommt -o. / Yo termina en -o.'],['Tú ___ música. (escuchar)','escuchas',['escucha','escucho'],'Tú bekommt -as. / Tú termina en -as.'],['Ella ___ español. (estudiar)','estudia',['estudio','estudias'],'Ella bekommt -a. / Ella termina en -a.']]]];
const key='poquito-v1';let S;try{S=JSON.parse(localStorage.getItem(key))||{done:[],cards:{}}}catch{S={done:[],cards:{}}}const app=document.querySelector('#app');let Q=[],pos=0,score=0,lesson=-1;const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function save(){try{localStorage.setItem(key,JSON.stringify(S))}catch{}}function speak(t){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(t);u.lang='es-EC';u.rate=.8;speechSynthesis.speak(u)}}function stats(){document.querySelector('#stats').textContent=S.done.length+' / '+L.length+' Lektionen'}function due(){return Object.keys(S.cards).filter(k=>S.cards[k].due<=Date.now())}function home(){stats();app.innerHTML='<section><div class="tag">Dein Spanischkurs · A1</div><h2>Un poquito cada día 🌱</h2><p>In kleinen Schritten Spanisch lernen. Heute reichen fünf Minuten.</p><div class="bar"><i style="width:'+S.done.length/L.length*100+'%"></i></div></section><section><h2>Wiederholen · Repasar</h2><p>'+due().length+' fällige Karten</p><button class="primary" id="review" '+(!due().length?'disabled':'')+'>Jetzt wiederholen</button></section><section><h2>Dein Lernweg</h2><div class="stack" id="lessons"></div></section><section><small>A2 · B1 · B2 — noch nicht verfügbar. Dies ist ein A1-Prototyp.</small></section>';document.querySelector('#review').onclick=()=>start(-1);L.forEach((l,i)=>{let b=document.createElement('button');b.textContent=(S.done.includes(i)?'✓ ':i+1+'. ')+l[0];b.disabled=i>0&&!S.done.includes(i-1);b.onclick=()=>teach(i);document.querySelector('#lessons').append(b)})}function teach(i){let l=L[i];app.innerHTML=`<button id="back">← Lernweg</button><section><div class="tag">A1 · Lektion ${i+1}</div><h2>${l[0]}</h2><h3>Deutsch</h3><p>${l[1]}</p><h3>Español</h3><p>${l[2]}</p><button id="audio">🔊 Spanisch anhören</button></section><button class="primary" id="go">Üben · Practicar</button>`;document.querySelector('#back').onclick=home;document.querySelector('#audio').onclick=()=>speak(l[2]);document.querySelector('#go').onclick=()=>start(i)}function start(i){lesson=i;pos=score=0;Q=shuffle(i<0?due():L[i][3].map((_,j)=>i+':'+j));if(!Q.length)return home();question()}function question(){let k=Q[pos],[i,j]=k.split(':').map(Number),q=L[i][3][j],typed=(lesson<0&&pos%2===1);app.innerHTML=`<button id="back">← Lernweg</button><section><small>${pos+1} / ${Q.length}</small><div class="bar"><i style="width:${pos/Q.length*100}%"></i></div><h2>${q[0]}</h2><p>${typed?'Schreibe die Antwort auf Spanisch.':'Wähle die passende Antwort.'}</p><div id="answers" class="stack"></div><div id="feedback"></div></section>`;document.querySelector('#back').onclick=home;let a=document.querySelector('#answers');if(typed){let f=document.createElement('form');f.innerHTML='<input autocomplete="off" placeholder="Tu respuesta" required><button class="primary">Prüfen</button>';f.onsubmit=e=>{e.preventDefault();answer(f.querySelector('input').value,q,k)};a.append(f)}else shuffle([q[1],...q[2]]).forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>answer(t,q,k);a.append(b)})}function answer(t,q,k){let norm=s=>s.trim().toLowerCase().normalize('NFC'),ok=norm(t)===norm(q[1]);if(ok)score++;let c=S.cards[k]||{n:0};c.n=ok?c.n+1:0;c.due=Date.now()+(ok?[1,3,7,14,30][Math.min(c.n-1,4)]*86400000:600000);S.cards[k]=c;save();document.querySelectorAll('#answers button,#answers input').forEach(b=>b.disabled=true);let f=document.querySelector('#feedback');f.className=ok?'good':'bad';f.style='padding:16px;margin-top:16px;border-radius:14px';f.innerHTML='<strong>'+(ok?'¡Muy bien! · Richtig':'Noch nicht · Casi')+'</strong><p></p><small></small><div class="row" style="margin-top:12px"><button id="hear">🔊</button><button class="primary" id="next">Weiter</button></div>';f.querySelector('p').textContent='Richtige Antwort: '+q[1];f.querySelector('small').textContent=q[3];document.querySelector('#hear').onclick=()=>speak(q[1]);document.querySelector('#next').onclick=()=>{pos++;if(pos<Q.length)question();else finish()}}function finish(){let pass=score/Q.length>=.8;if(lesson>=0&&pass&&!S.done.includes(lesson)){S.done.push(lesson);save()}stats();app.innerHTML=`<section><div class="tag">Sesión terminada</div><h2>${pass?'¡Excelente! 🌱':'¡Sigue practicando!'}</h2><p>${score} von ${Q.length} richtig. ${lesson>=0&&!pass?'Wiederhole diese Lektion, um die nächste freizuschalten.':'Deine Wiederholungen sind gespeichert.'}</p><button class="primary" id="home">Zum Lernweg</button>${lesson>=0?'<button id="again">Noch einmal</button>':''}</section>`;document.querySelector('#home').onclick=home;if(lesson>=0)document.querySelector('#again').onclick=()=>teach(lesson)}home();</script></html>
